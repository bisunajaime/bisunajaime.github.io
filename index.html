<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Title, description, canonical, Open Graph, Twitter and JSON-LD come from src/seo.ts (scripts/vite-plugin-seo.ts). -->
  <!--seo-head-->

  <!-- Icons -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/logo192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#fafaf9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <link rel="preload" href="/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin />
  <!-- Hero background is the LCP element; start it before the JS bundle renders the page. -->
  <link rel="preload" as="image" media="(max-width: 767px)" fetchpriority="high"
    imagesrcset="/assets/images/home/hero-mobile-390.webp 390w, /assets/images/home/hero-mobile-780.webp 780w" imagesizes="100vw" />
  <link rel="preload" as="image" media="(min-width: 768px)" fetchpriority="high"
    imagesrcset="/assets/images/home/hero-desktop-1440.webp 1440w, /assets/images/home/hero-desktop-2880.webp 2880w" imagesizes="100vw" />

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
